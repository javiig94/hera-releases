services:
  shop:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./private:/app/private   # el PDF y orders.jsonl viven fuera del contenedor
    expose: ["3000"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [shop]

volumes:
  caddy_data:
  caddy_config:
